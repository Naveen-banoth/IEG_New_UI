<div class="step-pane">
  <div class="pane-header">
    <div>
      <h3 class="pane-title">General Information</h3>
      <p class="pane-desc">Core metadata and investigator trial scope.</p>
    </div>
  </div>

  <div class="info-grid">
    <div class="info-item">
      <label>Protocol Title</label>
      <div class="val-bold">{{ applicationTitle }}</div>
    </div>
    <div class="info-item">
      <label>Application ID</label>
      <div class="val-code">{{ appId }}</div>
    </div>
    <div class="info-item">
      <label>Therapeutic Area</label>
      <div>Oncology &bull; Clinical Trials</div>
    </div>
    <div class="info-item">
      <label>Submission Date</label>
      <div>14-Jul-2026</div>
    </div>
  </div>
</div>
